<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Викторина</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link rel="stylesheet" href="/style.css" />
<script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body>
<div id="app">

  <section id="screen-home" class="screen active">
    <img src="/logo.svg" alt="" class="logo" />
    <h1 class="title-center">Викторина</h1>
    <div class="field">
      <label for="name-input">Ваше имя</label>
      <input id="name-input" maxlength="24" placeholder="Игрок" />
    </div>

    <div class="card">
      <h2>Играть</h2>
      <label for="pack-select">Набор вопросов</label>
      <select id="pack-select"></select>
      <div class="btn-row">
        <button id="btn-solo" class="btn">Одиночная игра</button>
        <button id="btn-bot" class="btn">Против бота</button>
      </div>
      <button id="btn-create" class="btn primary">Создать комнату (мультиплеер)</button>
    </div>

    <div class="card">
      <h2>Присоединиться</h2>
      <input id="code-input" maxlength="5" placeholder="КОД КОМНАТЫ" style="text-transform:uppercase" />
      <button id="btn-join" class="btn">Войти по коду</button>
    </div>

    <p id="home-error" class="error"></p>
  </section>

  <section id="screen-lobby" class="screen">
    <h1>Комната <span id="lobby-code"></span></h1>
    <p class="hint">Отправьте код друзьям в чате Max, пусть введут его в приложении</p>
    <ul id="lobby-players" class="players-list"></ul>
    <button id="btn-start" class="btn primary" hidden>Начать игру</button>
    <p id="lobby-wait" class="hint">Ожидание хоста…</p>
  </section>

  <section id="screen-question" class="screen">
    <div class="q-header">
      <span id="q-progress"></span>
      <span id="q-timer"></span>
    </div>
    <h2 id="q-text"></h2>
    <div id="q-options" class="options"></div>
    <p id="q-status" class="hint"></p>
  </section>

  <section id="screen-reveal" class="screen">
    <h2 id="reveal-title"></h2>
    <ol id="reveal-leaderboard" class="leaderboard"></ol>
    <p class="hint">Следующий вопрос скоро…</p>
  </section>

  <section id="screen-final" class="screen">
    <h1>Результаты</h1>
    <ol id="final-leaderboard" class="leaderboard"></ol>
    <button id="btn-restart" class="btn primary">На главный экран</button>
  </section>

</div>
<script src="/app.js"></script>
</body>
</html>
